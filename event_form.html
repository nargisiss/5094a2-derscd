{% extends "base.html" %}{% block title %}{{ page_title }} | UniEvent{% endblock %}
{% block content %}<a class="back-link" href="{{ url_for('admin_dashboard') }}">← İdarəetmə paneli</a><div class="form-page"><div class="eyebrow">TƏDBİR MƏLUMATLARI</div><h1>{{ page_title }}</h1><p class="muted">Tədbir haqqında məlumatları daxil et. Ulduzlu sahələr məcburidir.</p><form method="post" class="event-form"><label>Tədbirin adı *<input name="title" required maxlength="180" value="{{ event.title|default('') }}" placeholder="Məsələn, Elmi konfrans"></label><label>Kateqoriya *<select name="category_id" required><option value="">Kateqoriya seç</option>{% for c in categories %}<option value="{{ c.id }}" {% if event.category_id|string == c.id|string %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></label><label class="wide">Təsvir *<textarea name="description" rows="4" required placeholder="Tədbirin məzmununu yaz...">{{ event.description|default('') }}</textarea></label><label>Tarix *<input type="date" name="event_date" required value="{{ event.event_date|default('') }}"></label><label>Saat *<input type="time" name="event_time" required value="{{ event.event_time|default('') }}"></label><label>Keçirilmə yeri *<input name="location" required maxlength="180" value="{{ event.location|default('') }}" placeholder="Bina və otaq"></label><label>Maksimum iştirakçı sayı *<input type="number" name="capacity" min="1" required value="{{ event.capacity|default('50') }}"></label><div class="wide form-actions"><button class="button button-dark" type="submit">Yadda saxla ↗</button><a class="button button-outline" href="{{ url_for('admin_dashboard') }}">Ləğv et</a></div></form></div>{% endblock %}
